
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>算數紙本生成器</title>
<style>
:root{--bg:#fff;--panel:#fff;--ink:#4A3426;--muted:#8A6E5C;--line:#F2DFCC;--teal:#D9622B;--teal-soft:#FFF1E4;--orange:#E8552D;--amber:#F4A93C;--amber-soft:#FFF6E0;--desk:#FFF6EC;--shadow:0 2px 0 rgba(217,98,43,.06),0 10px 26px rgba(190,110,50,.10);box-sizing:border-box}
*,*:before,*:after{box-sizing:inherit} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;font-size:16px;line-height:1.55} button,input,select{font:inherit;color:inherit}
.top{padding:22px clamp(16px,4vw,40px) 10px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 28px}.top h1{margin:0;color:var(--orange);font-size:clamp(26px,3.4vw,38px);line-height:1.15}.top p{margin:4px 0 0;color:var(--muted)}.strip{font-size:28px;letter-spacing:8px}.wrap{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:22px;padding:10px clamp(16px,4vw,40px) 40px;align-items:start}@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px 18px 20px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}@media(max-width:860px){.panel{position:static;max-height:none}}.grp{margin-bottom:18px}.grp>h2{font-size:15px;margin:0 0 8px;color:var(--teal)}.hint{font-size:13.5px;color:var(--muted);margin:6px 0 0}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode{border:2px solid var(--line);background:transparent;border-radius:14px;padding:10px;text-align:left;cursor:pointer}.mode b{display:block;font-size:17px}.mode small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}.mode[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}.seg button{flex:1;border:0;background:transparent;padding:7px 4px;cursor:pointer;font-size:14px}.seg button+button{border-left:2px solid var(--line)}.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.stepper{display:flex;align-items:center;border:2px solid var(--line);border-radius:12px;overflow:hidden}.stepper button{border:0;background:transparent;width:38px;height:36px;font-size:20px;cursor:pointer}.stepper input{width:52px;text-align:center;border:0;background:transparent;font-weight:700}.f{display:block;font-size:13.5px;color:var(--muted);margin:10px 0 4px}.t,select.t{width:100%;border:2px solid var(--line);border-radius:10px;padding:7px 10px;background:transparent}.check{display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer}.check input{width:18px;height:18px;accent-color:var(--teal)}
.actions{display:grid;gap:8px;margin-top:6px}.btn{border:0;border-radius:14px;padding:12px 14px;font-size:17px;font-weight:700;cursor:pointer}.btn.re{background:var(--amber-soft);border:2px dashed var(--amber)}.btn.ppt{background:var(--orange);color:#fff}.btn.doc{background:#F4A93C}.btn.pdf{background:#fff;border:2px solid var(--ink)}.btn.print{background:#23B6BC;color:#fff}.status{min-height:22px;font-size:14px;color:var(--muted);margin-top:6px}
.desk{background:var(--desk);border:2px dashed var(--line);border-radius:24px;padding:18px;min-width:0}.desk-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:0 4px 14px;color:var(--muted);font-size:14.5px}.zoom{display:flex;gap:6px}.zoom button{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:3px 10px;cursor:pointer}.zoom button[aria-pressed="true"]{border-color:var(--teal);color:var(--teal);font-weight:700}.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--pw,300px),1fr));gap:18px;justify-items:center}.pg .lbl{font-size:13px;color:var(--muted);margin:0 0 5px 2px}.pg .lbl.a{color:var(--orange);font-weight:700}.paper{width:300px;aspect-ratio:210/297;background:#fff;box-shadow:0 1px 2px rgba(120,70,30,.12),0 8px 20px rgba(190,110,50,.14);color:#12343B;position:relative;padding:7.5% 7.5% 6%;overflow:hidden}.paper h3{margin:0 0 6px;font-size:clamp(12px,3.9vw,24px)}.meta{display:flex;justify-content:space-between;font-size:clamp(7px,2vw,12px);border-bottom:1px solid #B9C5C7;padding-bottom:6px}.instr{font-size:clamp(7px,2vw,12px);margin:8px 0 10px}.problems{display:grid;gap:4px 18px}.problem{display:flex;align-items:center;min-height:1.7em;font-weight:600;font-size:clamp(10px,3.2vw,20px);letter-spacing:.02em}.problem .n{width:2em;font-size:.72em;color:#6B7B7F}.problem .eq{flex:1}.problem .ans{display:inline-block;min-width:3.6em;border-bottom:1.8px solid #12343B;margin-left:.35em}.answer .ans{border:0;color:#E11D48;font-weight:800}.footer{position:absolute;bottom:3.5%;left:7.5%;right:7.5%;font-size:clamp(6px,1.7vw,10px);color:#849296;text-align:center}.note{font-size:13.5px;color:var(--muted);margin:14px 4px 0}
@media print{body{background:white}.top,.panel,.desk-head,.note,.lbl{display:none!important}.wrap{display:block;padding:0}.desk{border:0;padding:0;background:white}.pages{display:block}.pg{break-after:page}.paper{width:210mm!important;height:297mm!important;box-shadow:none;padding:16mm 16mm 14mm}.paper h3{font-size:20pt}.meta,.instr{font-size:10pt}.problem{font-size:16pt}.footer{font-size:9pt}}
</style>
</head>
<body>
<header class="top"><div><h1>算數紙本生成器</h1><p>選好運算、難度與題數，一鍵產生可列印、可編輯的 A4 算數學習單。</p></div><div class="strip" aria-hidden="true">➕ ➖ ✖️ ➗ 🧮</div></header>
<main class="wrap">
<section class="panel" aria-label="設定">
  <div class="grp"><h2>題型</h2><div class="modes" id="modes">
    <button class="mode" data-v="add" aria-pressed="true"><b>加法</b><small>依難度控制數字範圍</small></button>
    <button class="mode" data-v="sub"><b>減法</b><small>預設答案不出現負數</small></button>
    <button class="mode" data-v="mul"><b>乘法</b><small>九九乘法到較大乘數</small></button>
    <button class="mode" data-v="div"><b>除法</b><small>預設整除、無餘數</small></button>
    <button class="mode" data-v="mixed"><b>混合運算</b><small>隨機混合加減乘除</small></button>
    <button class="mode" data-v="blank"><b>填空題</b><small>未知數可能在前、中、後</small></button>
  </div></div>
  <div class="grp"><h2>難度</h2><div class="seg" id="diff"><button data-v="0">簡單</button><button data-v="1" aria-pressed="true">中等</button><button data-v="2">困難</button></div><p class="hint" id="diffHint"></p></div>
  <div class="grp"><h2>題目設定</h2>
    <label class="f">每張題數</label><select class="t" id="perPage"><option>10</option><option selected>20</option><option>25</option><option>30</option><option>40</option></select>
    <label class="check"><input type="checkbox" id="allowNegative">減法可出現負數答案</label>
    <label class="check"><input type="checkbox" id="remainder">除法可有餘數</label>
    <label class="check"><input type="checkbox" id="noRepeat" checked>同一張盡量不重複題目</label>
  </div>
  <div class="grp"><h2>張數與解答</h2><div class="row"><div class="stepper"><button id="minus">−</button><input id="count" type="number" min="1" max="20" value="3"><button id="plus">＋</button></div><span>張</span></div>
    <div class="seg" id="ans" style="margin-top:10px"><button data-v="each" aria-pressed="true">每張後附解答</button><button data-v="end">解答集中最後</button><button data-v="none">不附解答</button></div>
  </div>
  <div class="grp"><h2>文字</h2><label class="f">標題</label><input class="t" id="title" placeholder="算數練習"><label class="f">說明文字</label><input class="t" id="instr" placeholder="請計算下列各題，並把答案寫在空格中。"><label class="f">頁尾文字</label><input class="t" id="footer" value="愛迪樂 鍾孟修 職能治療師"><label class="check"><input type="checkbox" id="nameDate" checked>加上姓名、日期欄</label></div>
  <div class="actions"><button class="btn re" id="regen">重新出題</button><button class="btn ppt" id="dlPpt">下載 PowerPoint</button><button class="btn doc" id="dlDoc">下載 Word</button><button class="btn pdf" id="dlPdf">下載 PDF</button><button class="btn print" id="printBtn">直接列印</button></div>
  <div class="status" id="status">已準備好。</div>
</section>
<section class="desk"><div class="desk-head"><span id="summary"></span><div class="zoom" id="zoom"><button data-w="220">小</button><button data-w="300" aria-pressed="true">中</button><button data-w="460">大</button></div></div><div class="pages" id="pages"></div><p class="note">PowerPoint 與 Word 下載後可再編輯；PDF 適合直接列印。若瀏覽器阻擋下載，請允許此頁面下載檔案。</p></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id); const state={mode:'add',diff:1,sheets:3,answers:'each'}; let sheets=[];
const MODE={add:['加法','＋'],sub:['減法','－'],mul:['乘法','×'],div:['除法','÷'],mixed:['混合運算',''],blank:['填空題','']};
const DIFF=[{name:'簡單',desc:'數字較小，適合基礎練習'},{name:'中等',desc:'數字範圍較大，適合一般練習'},{name:'困難',desc:'較大數字或較複雜的乘除運算'}];
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a} function pick(a){return a[rnd(0,a.length-1)]}
function range(mode,d){ if(mode==='mul'||mode==='div') return d===0?[1,9]:d===1?[2,12]:[2,20]; return d===0?[0,10]:d===1?[0,100]:[0,1000]; }
function baseProblem(mode,d){ let op=mode==='mixed'?pick(['add','sub','mul','div']):mode==='blank'?pick(['add','sub','mul','div']):mode; let a,b,ans,rem=null; const [lo,hi]=range(op,d);
 if(op==='add'){a=rnd(lo,hi);b=rnd(lo,hi);ans=a+b}
 if(op==='sub'){a=rnd(lo,hi);b=rnd(lo,hi); if(!$('allowNegative').checked&&b>a)[a,b]=[b,a]; ans=a-b}
 if(op==='mul'){a=rnd(lo,hi);b=rnd(lo,hi);ans=a*b}
 if(op==='div'){ let divisor=rnd(Math.max(1,lo),hi); let q=rnd(d===0?1:2,hi); if($('remainder').checked){rem=rnd(0,Math.max(0,divisor-1));a=divisor*q+rem;b=divisor;ans=q}else{a=divisor*q;b=divisor;ans=q} }
 const sym={add:'＋',sub:'－',mul:'×',div:'÷'}[op]; let display=`${a} ${sym} ${b} ＝`; let key=`${op}-${a}-${b}`;
 if(mode==='blank'){ const pos=rnd(0,2); if(pos===0) display=`□ ${sym} ${b} ＝ ${ans}`; else if(pos===1) display=`${a} ${sym} □ ＝ ${ans}`; else display=`${a} ${sym} ${b} ＝ □`; }
 return {op,a,b,ans,rem,display,key}; }
function genSheet(no){const n=+$('perPage').value, arr=[],used=new Set(); for(let i=0;i<n;i++){let p,tries=0; do{p=baseProblem(state.mode,state.diff);tries++}while($('noRepeat').checked&&used.has(p.key)&&tries<80); used.add(p.key);arr.push(p)} return {no,problems:arr};}
function generate(){sheets=Array.from({length:state.sheets},(_,i)=>genSheet(i+1));render()}
function pagesOrder(){if(state.answers==='none')return sheets.map(sh=>({sh,ans:false})); if(state.answers==='each')return sheets.flatMap(sh=>[{sh,ans:false},{sh,ans:true}]); return [...sheets.map(sh=>({sh,ans:false})),...sheets.map(sh=>({sh,ans:true}))]}
function titleText(){return $('title').value.trim()||`${MODE[state.mode][0]}練習`}
function instrText(){return $('instr').value.trim()||'請計算下列各題，並把答案寫在空格中。'}
function answerText(p){return p.rem!==null&&p.rem!==0?`${p.ans} 餘 ${p.rem}`:String(p.ans)}
function render(){const pages=$('pages');pages.innerHTML=''; const pw=parseInt(getComputedStyle(pages).getPropertyValue('--pw'))||300; pagesOrder().forEach(({sh,ans})=>{const pg=document.createElement('div');pg.className='pg';const lbl=document.createElement('p');lbl.className='lbl'+(ans?' a':'');lbl.textContent=`第 ${sh.no} 張${ans?'・解答':''}`;const paper=document.createElement('div');paper.className='paper'+(ans?' answer':'');paper.style.width=pw+'px';paper.innerHTML=`<h3>${esc(titleText())}${ans?'（解答）':''}</h3><div class="meta">${$('nameDate').checked?'<span>姓名：____________</span><span>日期：____年____月____日</span>':'<span></span>'}</div><div class="instr">${esc(instrText())}</div><div class="problems"></div><div class="footer">${esc($('footer').value.trim())}</div>`;const grid=paper.querySelector('.problems'); const cols=sh.problems.length>=30?3:sh.problems.length>=16?2:1;grid.style.gridTemplateColumns=`repeat(${cols},1fr)`; sh.problems.forEach((p,i)=>{const d=document.createElement('div');d.className='problem'; d.innerHTML=`<span class="n">${i+1}.</span><span class="eq">${esc(p.display)} ${ans?`<span class="ans">${esc(answerText(p))}</span>`:'<span class="ans">&nbsp;</span>'}</span>`;grid.appendChild(d)});pg.append(lbl,paper);pages.appendChild(pg)});$('summary').textContent=`${MODE[state.mode][0]}・${DIFF[state.diff].name}｜題目 ${state.sheets} 張，共 ${pagesOrder().length} 頁`;$('diffHint').textContent=DIFF[state.diff].desc;}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bindGroup(id,key){$(id).addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(!b)return;state[key]=key==='diff'?+b.dataset.v:b.dataset.v;$(id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));generate()})}
bindGroup('modes','mode');bindGroup('diff','diff');bindGroup('ans','answers');
const setCount=v=>{state.sheets=Math.max(1,Math.min(20,v|0||1));$('count').value=state.sheets;generate()};$('minus').onclick=()=>setCount(state.sheets-1);$('plus').onclick=()=>setCount(state.sheets+1);$('count').onchange=e=>setCount(+e.target.value);$('regen').onclick=generate;['perPage','allowNegative','remainder','noRepeat','nameDate'].forEach(id=>$(id).addEventListener('change',generate));['title','instr','footer'].forEach(id=>$(id).addEventListener('input',render));$('printBtn').onclick=()=>window.print();$('zoom').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('zoom').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('pages').style.setProperty('--pw',b.dataset.w+'px');render()};
function fname(ext){return `算數_${MODE[state.mode][0]}_${DIFF[state.diff].name}_${state.sheets}張.${ext}`}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
async function exportPpt(){if(typeof PptxGenJS==='undefined'){return status('PowerPoint 元件尚未載入，請確認網路連線。')}status('正在產生 PowerPoint…');const pptx=new PptxGenJS();pptx.defineLayout({name:'A4P',width:8.27,height:11.69});pptx.layout='A4P';pptx.author='愛迪樂';for(const {sh,ans} of pagesOrder()){const s=pptx.addSlide();s.background={color:'FFFFFF'};s.addText(titleText()+(ans?'（解答）':''),{x:.62,y:.48,w:7,h:.35,fontFace:'Microsoft JhengHei',fontSize:20,bold:true,color:'12343B'});if($('nameDate').checked)s.addText('姓名：____________　　　　　　日期：____年____月____日',{x:.62,y:.95,w:7,h:.23,fontFace:'Microsoft JhengHei',fontSize:10,color:'50686D'});s.addText(instrText(),{x:.62,y:1.28,w:7,h:.28,fontFace:'Microsoft JhengHei',fontSize:10,color:'12343B'});const n=sh.problems.length,cols=n>=30?3:n>=16?2:1,rows=Math.ceil(n/cols),top=1.7,usable=8.9,rowH=usable/rows,colW=6.95/cols;sh.problems.forEach((p,i)=>{const c=Math.floor(i/rows),r=i%rows,x=.62+c*colW,y=top+r*rowH;const txt=`${i+1}.  ${p.display} ${ans?answerText(p):'________'}`;s.addText(txt,{x,y,w:colW-.08,h:Math.min(.35,rowH),fontFace:'Microsoft JhengHei',fontSize:n>=30?12:15,color:ans?'E11D48':'12343B',breakLine:false,margin:0})});if($('footer').value.trim())s.addText($('footer').value.trim(),{x:.62,y:11.18,w:7,h:.18,fontFace:'Microsoft JhengHei',fontSize:8,color:'849296',align:'center'})}const blob=await pptx.write({outputType:'blob'});downloadBlob(blob,fname('pptx'));status('PowerPoint 已產生。')}
async function exportDoc(){if(typeof docx==='undefined'){return status('Word 元件尚未載入，請確認網路連線。')}status('正在產生 Word…');const D=docx,children=[];for(const [pi,{sh,ans}] of pagesOrder().entries()){children.push(new D.Paragraph({children:[new D.TextRun({text:titleText()+(ans?'（解答）':''),bold:true,size:34,font:'Microsoft JhengHei'})],spacing:{after:120}}));if($('nameDate').checked)children.push(new D.Paragraph({text:'姓名：____________　　　　　　日期：____年____月____日',spacing:{after:100}}));children.push(new D.Paragraph({text:instrText(),spacing:{after:120}}));const rows=[];const cols=sh.problems.length>=30?3:sh.problems.length>=16?2:1;for(let i=0;i<sh.problems.length;i+=cols){const cells=[];for(let c=0;c<cols;c++){const idx=i+c,p=sh.problems[idx];cells.push(new D.TableCell({children:[new D.Paragraph(p?`${idx+1}.  ${p.display} ${ans?answerText(p):'________'}`:'')]}))}rows.push(new D.TableRow({children:cells}))}children.push(new D.Table({rows,width:{size:100,type:D.WidthType.PERCENTAGE},borders:{top:{style:D.BorderStyle.NONE},bottom:{style:D.BorderStyle.NONE},left:{style:D.BorderStyle.NONE},right:{style:D.BorderStyle.NONE},insideHorizontal:{style:D.BorderStyle.NONE},insideVertical:{style:D.BorderStyle.NONE}}}));if($('footer').value.trim())children.push(new D.Paragraph({text:$('footer').value.trim(),alignment:D.AlignmentType.CENTER,spacing:{before:160}}));if(pi<pagesOrder().length-1)children.push(new D.Paragraph({children:[new D.PageBreak()]}));}const doc=new D.Document({sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:720,right:720,bottom:720,left:720}}},children}]});downloadBlob(await D.Packer.toBlob(doc),fname('docx'));status('Word 已產生。')}
async function exportPdf(){if(!window.jspdf){return status('PDF 元件尚未載入，請確認網路連線。')}status('正在產生 PDF…');const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'mm',format:'a4'});const pages=pagesOrder();for(let pi=0;pi<pages.length;pi++){if(pi)pdf.addPage();const {sh,ans}=pages[pi];pdf.setFont('helvetica','normal');pdf.setFontSize(16);pdf.text(titleText()+(ans?' (Answers)':''),16,16);pdf.setFontSize(9);if($('nameDate').checked)pdf.text('Name: ____________    Date: ____ / ____ / ____',16,24);pdf.text(instrText().replace(/[\u4e00-\u9fff]/g,' '),16,31);const n=sh.problems.length,cols=n>=30?3:n>=16?2:1,rows=Math.ceil(n/cols),top=40,rowH=230/rows,colW=178/cols;pdf.setFontSize(n>=30?8:11);sh.problems.forEach((p,i)=>{const c=Math.floor(i/rows),r=i%rows;pdf.text(`${i+1}. ${p.a} ${p.op==='add'?'+':p.op==='sub'?'-':p.op==='mul'?'x':'/'} ${p.b} = ${ans?answerText(p):'______'}`,16+c*colW,top+r*rowH)});if($('footer').value.trim())pdf.text($('footer').value.trim().replace(/[\u4e00-\u9fff]/g,' '),105,287,{align:'center'})}downloadBlob(pdf.output('blob'),fname('pdf'));status('PDF 已產生。')}
function status(t){$('status').textContent=t}$('dlPpt').onclick=exportPpt;$('dlDoc').onclick=exportDoc;$('dlPdf').onclick=exportPdf;generate();
})();
</script>
</body></html>
